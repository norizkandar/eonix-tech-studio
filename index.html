<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <meta name="google-site-verification" content="v5mDBIUS65HTOal5Eomv26ZHuoqDJNgRkTEBId_ix-A" />
  <title>Smart Academy</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="splash" class="splash">
    <div class="logo-orb">SA</div>
    <h1>SMART ACADEMY</h1>
    <p>BEYOND THE GRADE.</p>
    <small>Created by Norizkandar · Eonix Tech Studio</small>
  </div>

  <section id="authScreen" class="auth-screen hidden">
    <div class="auth-card">
      <div class="brand-mini">SMART ACADEMY</div>
      <h2 id="authTitle">Welcome back</h2>
      <p id="authSubtitle">Sign in to continue learning.</p>

      <form id="loginForm">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button class="primary-btn" type="submit">Sign In</button>
      </form>

      <form id="signupForm" class="hidden">
        <input id="signupName" type="text" placeholder="Full name" required>
        <input id="signupEmail" type="email" placeholder="Email" required>
        <input id="signupPassword" type="password" placeholder="Password" minlength="6" required>
        <select id="signupRole" required>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="parent">Parent</option>
        </select>
        <button class="primary-btn" type="submit">Create Account</button>
      </form>

      <button id="toggleAuth" class="text-btn">Create a new account</button>
      <div id="authMessage" class="message"></div>
    </div>
  </section>

  <main id="appShell" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="brand-orb">SA</div>
        <div><strong>SMART</strong><span>ACADEMY</span></div>
      </div>
      <nav id="sidebarNav"></nav>
      <div class="sidebar-footer">
        <button data-page="settings">⚙ Settings</button>
        <button id="logout">↪ Log out</button>
      </div>
    </aside>

    <section class="main-area">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div class="search-wrap">
          <input id="globalSearch" placeholder="Search classes, teachers, subjects...">
        </div>
        <button data-page="notifications" class="icon-btn">🔔</button>
        <div id="avatar" class="avatar">N</div>
      </header>

      <div id="content" class="content"></div>
    </section>

    <nav id="mobileNav" class="mobile-nav"></nav>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="closeModal" class="modal-close">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
