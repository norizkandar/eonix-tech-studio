<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07111f"
  >

  <meta
    name="google-site-verification"
    content="v5mDBIUS65HTOal5Eomv26ZHuoqDJNgRkTEBId_ix-A"
  >

  <title>Smart Academy</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

</head>


<body>


  <!-- =====================================================
       SPLASH SCREEN
  ====================================================== -->

  <div
    id="splash"
    class="splash"
  >

    <div class="logo-orb">
      SA
    </div>

    <h1>
      SMART ACADEMY
    </h1>

    <p>
      BEYOND THE GRADE.
    </p>

    <small>
      Created by Norizkandar · Eonix Tech Studio
    </small>

  </div>


  <!-- =====================================================
       AUTH SCREEN
  ====================================================== -->

  <section
    id="authScreen"
    class="auth-screen hidden"
  >

    <div class="auth-card">


      <div class="brand-mini">
        SMART ACADEMY
      </div>


      <h2 id="authTitle">
        Welcome back
      </h2>


      <p id="authSubtitle">
        Sign in to continue learning.
      </p>


      <!-- LOGIN -->

      <form id="loginForm">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        >

        <button
          class="primary-btn"
          type="submit"
        >
          Sign In
        </button>

      </form>


      <!-- SIGN UP -->

      <form
        id="signupForm"
        class="hidden"
      >

        <input
          id="signupName"
          type="text"
          placeholder="Full name"
          autocomplete="name"
          required
        >

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
          minlength="6"
          autocomplete="new-password"
          required
        >


        <select
          id="signupRole"
          required
        >

          <option value="student">
            Student
          </option>

          <option value="teacher">
            Teacher
          </option>

          <option value="parent">
            Parent
          </option>

        </select>


        <button
          class="primary-btn"
          type="submit"
        >
          Create Account
        </button>

      </form>


      <!-- TOGGLE LOGIN / SIGNUP -->

      <button
        id="toggleAuth"
        class="text-btn"
        type="button"
      >
        Create a new account
      </button>


      <div
        id="authMessage"
        class="message"
      ></div>


    </div>

  </section>


  <!-- =====================================================
       MAIN APPLICATION
  ====================================================== -->

  <main
    id="appShell"
    class="app-shell hidden"
  >


    <!-- ===================================================
         SIDEBAR
    ==================================================== -->

    <aside class="sidebar">


      <!-- BRAND -->

      <div class="sidebar-brand">

        <div class="brand-orb">
          SA
        </div>

        <div>

          <strong>
            SMART
          </strong>

          <span>
            ACADEMY
          </span>

        </div>

      </div>


      <!-- NAVIGATION -->

      <nav
        id="sidebarNav"
      ></nav>


      <!-- SIDEBAR FOOTER -->

      <div class="sidebar-footer">

        <button
          data-page="settings"
          type="button"
        >
          ⚙ Settings
        </button>

        <button
          id="logout"
          type="button"
        >
          ↪ Log out
        </button>

      </div>


    </aside>


    <!-- ===================================================
         MAIN AREA
    ==================================================== -->

    <section class="main-area">


      <!-- TOP BAR -->

      <header class="topbar">


        <!-- MOBILE MENU -->

        <button
          id="mobileMenu"
          class="icon-btn"
          type="button"
          aria-label="Open menu"
        >
          ☰
        </button>


        <!-- SEARCH -->

        <div class="search-wrap">

          <input
            id="globalSearch"
            type="search"
            placeholder="Search classes, teachers, subjects..."
            autocomplete="off"
          >

        </div>


        <!-- NOTIFICATIONS -->

        <button
          data-page="notifications"
          class="icon-btn"
          type="button"
          aria-label="Notifications"
        >
          🔔
        </button>


        <!-- AVATAR -->

        <div
          id="avatar"
          class="avatar"
        >
          N
        </div>


      </header>


      <!-- =================================================
           PAGE CONTENT

           IMPORTANT:
           app.js uses #content
      ================================================== -->

      <div
        id="content"
        class="content"
      ></div>


    </section>


    <!-- ===================================================
         MOBILE NAVIGATION
    ==================================================== -->

    <nav
      id="mobileNav"
      class="mobile-nav"
    ></nav>


  </main>


  <!-- =====================================================
       MODAL
  ====================================================== -->

  <div
    id="modal"
    class="modal hidden"
  >

    <div class="modal-box">


      <button
        id="closeModal"
        class="modal-close"
        type="button"
        aria-label="Close"
      >
        ×
      </button>


      <div
        id="modalContent"
      ></div>


    </div>

  </div>


  <!-- =====================================================
       TOAST
  ====================================================== -->

  <div
    id="toast"
    class="toast"
  ></div>


  <!-- =====================================================
       APPLICATION JAVASCRIPT
  ====================================================== -->

  <script src="app.js"></script>


</body>

</html>
